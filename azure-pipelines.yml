trigger:
  - main

pool:
  name: "Default"

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

steps:
  - script: echo "✅ Hello from $(Agent.Name)! The agent is working fine."
    displayName: "Test agent connection"

  - script: |
      echo "Current directory:"
      pwd
      echo "Listing files:"
      ls -la
    displayName: "Check workspace contents"

  # Check/Install Maven and Java on Ubuntu
  - bash: |
      echo "Checking Java and Maven installation..."
      if ! command -v java &> /dev/null; then
        echo "Java not found. Installing OpenJDK 21..."
        sudo apt-get update
        sudo apt-get install -y openjdk-21-jdk
      else
        echo "Java is already installed"
      fi
      
      if ! command -v mvn &> /dev/null; then
        echo "Maven not found. Installing Maven..."
        sudo apt-get install -y maven
      else
        echo "Maven is already installed"
      fi
      
      echo "Java version:"
      java -version
      echo "Maven version:"
      mvn -version
    displayName: 'Setup Java & Maven'

  # Cache Maven dependencies
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: $(MAVEN_CACHE_FOLDER)
    displayName: 'Cache Maven packages'

  # Clean and compile
  - bash: |
      echo "Running Maven clean compile..."
      mvn clean compile -B
    displayName: 'Maven Clean & Compile'

  # Run tests
  - bash: |
      echo "Running Maven tests..."
      mvn test -B
    displayName: 'Run Unit Tests'

  # Publish test results
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'Unit Tests'
    displayName: 'Publish Test Results'

  # Publish code coverage results
  - task: PublishCodeCoverageResults@1
    condition: succeededOrFailed()
    inputs:
      codeCoverageTool: 'JaCoCo'
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
      reportDirectory: '$(System.DefaultWorkingDirectory)/target/site/jacoco'
      failIfCoverageEmpty: false
    displayName: 'Publish Code Coverage'

  # Package application
  - bash: |
      echo "Running Maven package..."
      mvn package -DskipTests -B
    displayName: 'Maven Package'

